<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post | Converstation AI Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cobalt: #0052CC; --cobalt-dark: #003d99; --cobalt-light: #EBF8FF;
      --ink: #1A202C; --ink-light: #4A5568; --muted: #718096;
      --border: #E2E8F0; --bg: #ffffff; --nav-h: 72px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; color: var(--ink); background: var(--bg); }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--nav-h); background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; }
    .nav-logo { font-size: 18px; font-weight: 700; color: var(--ink); text-decoration: none; }
    .nav-logo span { color: var(--cobalt); }
    .nav-back { font-size: 14px; color: var(--cobalt); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .nav-back:hover { text-decoration: underline; }

    .post-wrap { max-width: 740px; margin: 0 auto; padding: calc(var(--nav-h) + 48px) 5% 80px; }

    /* POST HEADER */
    .post-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--cobalt); background: var(--cobalt-light); padding: 4px 12px; border-radius: 20px; margin-bottom: 18px; }
    .post-title { font-family: 'DM Serif Display', serif; font-size: clamp(28px, 5vw, 44px); color: var(--ink); line-height: 1.15; margin-bottom: 20px; }
    .post-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--cobalt); color: white; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .post-meta-text { font-size: 14px; color: var(--muted); }
    .post-meta-text strong { color: var(--ink); font-weight: 600; display: block; }

    /* COVER MEDIA */
    .cover-media { width: 100%; border-radius: 12px; margin-bottom: 36px; overflow: hidden; }
    .cover-media img { width: 100%; height: auto; display: block; }
    .cover-media video, .cover-media audio { width: 100%; display: block; }

    /* POST CONTENT */
    .post-content { font-size: 17px; color: var(--ink-light); line-height: 1.8; }
    .post-content h2 { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--ink); margin: 36px 0 14px; }
    .post-content h3 { font-size: 18px; font-weight: 700; color: var(--ink); margin: 28px 0 10px; }
    .post-content p { margin-bottom: 20px; }
    .post-content img { max-width: 100%; border-radius: 10px; margin: 20px 0; }
    .post-content video { max-width: 100%; border-radius: 10px; margin: 20px 0; }
    .post-content audio { width: 100%; margin: 16px 0; }
    .post-content blockquote { border-left: 4px solid var(--cobalt); padding: 16px 20px; background: var(--cobalt-light); border-radius: 0 8px 8px 0; margin: 24px 0; font-style: italic; color: var(--ink); }
    .post-content ul, .post-content ol { padding-left: 28px; margin-bottom: 20px; }
    .post-content li { margin-bottom: 8px; }
    .post-content a { color: var(--cobalt); }

    /* SHARE */
    .share-bar { display: flex; align-items: center; gap: 12px; padding: 24px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 48px 0 0; }
    .share-label { font-size: 14px; font-weight: 600; color: var(--muted); }
    .share-btn { font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 8px; border: 1.5px solid var(--border); background: white; color: var(--ink-light); cursor: pointer; transition: all 0.2s; font-family: inherit; text-decoration: none; display: inline-block; }
    .share-btn:hover { border-color: var(--cobalt); color: var(--cobalt); }

    /* COMMENTS */
    .comments-section { margin-top: 48px; }
    .comments-title { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--ink); margin-bottom: 28px; }
    .comment-form { background: #F7FAFC; border: 1.5px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 36px; }
    .comment-form h3 { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; color: var(--ink); background: white; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: var(--cobalt); }
    .form-textarea { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; color: var(--ink); background: white; outline: none; resize: vertical; min-height: 100px; transition: border-color 0.2s; margin-bottom: 12px; }
    .form-textarea:focus { border-color: var(--cobalt); }
    .submit-btn { background: var(--cobalt); color: white; border: none; border-radius: 8px; padding: 11px 24px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .submit-btn:hover { background: var(--cobalt-dark); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-message { font-size: 14px; margin-top: 10px; padding: 10px 14px; border-radius: 8px; display: none; }
    .form-message.success { background: #C6F6D5; color: #276749; display: block; }
    .form-message.error { background: #FED7D7; color: #C53030; display: block; }

    .comment-list { display: flex; flex-direction: column; gap: 20px; }
    .comment { display: flex; gap: 14px; }
    .comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--cobalt-light); color: var(--cobalt); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .comment-bubble { flex: 1; background: #F7FAFC; border: 1px solid var(--border); border-radius: 0 12px 12px 12px; padding: 14px 18px; }
    .comment-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
    .comment-name { font-size: 14px; font-weight: 700; color: var(--ink); }
    .comment-date { font-size: 12px; color: var(--muted); }
    .comment-text { font-size: 15px; color: var(--ink-light); line-height: 1.65; }
    .comment-reply-btn { font-size: 12px; color: var(--cobalt); background: none; border: none; cursor: pointer; margin-top: 8px; font-family: inherit; font-weight: 600; }
    .reply-form { margin-top: 12px; display: none; }
    .reply-form.open { display: block; }
    .no-comments { font-size: 15px; color: var(--muted); text-align: center; padding: 32px 0; }

    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--cobalt); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { background: var(--ink); padding: 28px 5%; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .footer-logo { font-size: 15px; font-weight: 700; color: white; text-decoration: none; }
    .footer-logo span { color: #60A5FA; }
    .footer-copy { font-size: 13px; color: rgba(255,255,255,0.35); }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Converstation <span>AI</span></a>
  <a href="/blog.html" class="nav-back">← Back to Blog</a>
</nav>

<div class="post-wrap">
  <div id="post-content">
    <div class="loading"><div class="spinner"></div>Loading post…</div>
  </div>

  <div id="comments-section" class="comments-section" style="display:none">
    <h2 class="comments-title">Discussion</h2>
    <div class="comment-form">
      <h3>Leave a comment</h3>
      <div class="form-row">
        <input id="c-name" class="form-input" type="text" placeholder="Your name" required />
        <input id="c-email" class="form-input" type="email" placeholder="Your email (not published)" required />
      </div>
      <textarea id="c-text" class="form-textarea" placeholder="Share your thoughts…"></textarea>
      <button class="submit-btn" id="submit-comment">Post Comment</button>
      <div class="form-message" id="comment-msg"></div>
    </div>
    <div id="comment-list" class="comment-list">
      <div class="loading"><div class="spinner"></div>Loading comments…</div>
    </div>
  </div>
</div>

<footer>
  <a href="/" class="footer-logo">Converstation <span>AI</span> LLC</a>
  <span class="footer-copy">© 2026 Converstation AI LLC. All rights reserved.</span>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, getDocs, serverTimestamp, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "converstation-ai.firebaseapp.com",
    projectId: "converstation-ai",
    storageBucket: "converstation-ai.appspot.com",
    messagingSenderId: "264470224727",
    appId: "1:264470224727:web:abc123"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const postId = new URLSearchParams(window.location.search).get("id");

  async function loadPost() {
    if (!postId) { document.getElementById("post-content").innerHTML = "<p>Post not found.</p>"; return; }
    const snap = await getDoc(doc(db, "posts", postId));
    if (!snap.exists()) { document.getElementById("post-content").innerHTML = "<p>Post not found.</p>"; return; }
    const p = snap.data();
    document.title = `${p.title} | Converstation AI Blog`;

    const date = p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }) : "";
    const initials = (p.authorName || "CA").split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();

    let coverHtml = "";
    if (p.coverImage) coverHtml = `<div class="cover-media"><img src="${p.coverImage}" alt="Cover" /></div>`;
    else if (p.coverVideo) coverHtml = `<div class="cover-media"><video controls src="${p.coverVideo}"></video></div>`;
    else if (p.coverAudio) coverHtml = `<div class="cover-media"><audio controls src="${p.coverAudio}"></audio></div>`;

    document.getElementById("post-content").innerHTML = `
      <span class="post-tag">${p.tag || "Update"}</span>
      <h1 class="post-title">${p.title}</h1>
      <div class="post-meta">
        <div class="post-avatar">${initials}</div>
        <div class="post-meta-text"><strong>${p.authorName || "Converstation AI"}</strong>${date}</div>
      </div>
      ${coverHtml}
      <div class="post-content">${p.content || ""}</div>
      <div class="share-bar">
        <span class="share-label">Share:</span>
        <a class="share-btn" href="https://twitter.com/intent/tweet?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(p.title)}" target="_blank">𝕏 Twitter</a>
        <a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.href)}" target="_blank">LinkedIn</a>
        <button class="share-btn" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!'">Copy Link</button>
      </div>`;

    document.getElementById("comments-section").style.display = "block";
    loadComments();
  }

  async function loadComments() {
    const list = document.getElementById("comment-list");
    try {
      const q = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc"));
      const snap = await getDocs(q);
      if (snap.empty) { list.innerHTML = '<p class="no-comments">No comments yet. Be the first!</p>'; return; }
      list.innerHTML = "";
      snap.forEach(docSnap => {
        const c = docSnap.data();
        const date = c.createdAt?.toDate ? c.createdAt.toDate().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "";
        const initials = (c.name || "?").split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
        const div = document.createElement("div");
        div.className = "comment";
        div.innerHTML = `
          <div class="comment-avatar">${initials}</div>
          <div class="comment-bubble">
            <div class="comment-header">
              <span class="comment-name">${c.name}</span>
              <span class="comment-date">${date}</span>
            </div>
            <div class="comment-text">${c.text}</div>
            <button class="comment-reply-btn" data-id="${docSnap.id}">↩ Reply</button>
            <div class="reply-form" id="reply-${docSnap.id}">
              <input class="form-input" placeholder="Your name" id="rn-${docSnap.id}" style="margin-bottom:8px" />
              <input class="form-input" type="email" placeholder="Your email" id="re-${docSnap.id}" style="margin-bottom:8px" />
              <textarea class="form-textarea" placeholder="Your reply…" id="rt-${docSnap.id}" style="min-height:70px;margin-bottom:8px"></textarea>
              <button class="submit-btn" style="font-size:13px;padding:8px 16px" data-reply-to="${docSnap.id}">Post Reply</button>
            </div>
            ${(c.replies || []).map(r => {
              const ri = (r.name || "?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
              const rd = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";
              return `<div class="comment" style="margin-top:14px">
                <div class="comment-avatar" style="width:30px;height:30px;font-size:11px">${ri}</div>
                <div class="comment-bubble" style="background:white">
                  <div class="comment-header"><span class="comment-name">${r.name}</span><span class="comment-date">${rd}</span></div>
                  <div class="comment-text">${r.text}</div>
                </div></div>`;
            }).join("")}
          </div>`;
        list.appendChild(div);
      });

      // Reply toggles
      document.querySelectorAll(".comment-reply-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const rf = document.getElementById("reply-" + btn.dataset.id);
          rf.classList.toggle("open");
        });
      });

      // Reply submissions
      document.querySelectorAll("[data-reply-to]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const cid = btn.dataset.replyTo;
          const name = document.getElementById("rn-" + cid).value.trim();
          const text = document.getElementById("rt-" + cid).value.trim();
          if (!name || !text) return;
          btn.disabled = true;
          const cRef = doc(db, "posts", postId, "comments", cid);
          const cSnap = await getDoc(cRef);
          const existing = cSnap.data().replies || [];
          await updateDoc(cRef, { replies: [...existing, { name, text, createdAt: new Date() }] });
          loadComments();
        });
      });

    } catch (err) {
      console.error(err);
      list.innerHTML = '<p class="no-comments">Could not load comments.</p>';
    }
  }

  document.getElementById("submit-comment").addEventListener("click", async () => {
    const name = document.getElementById("c-name").value.trim();
    const email = document.getElementById("c-email").value.trim();
    const text = document.getElementById("c-text").value.trim();
    const msg = document.getElementById("comment-msg");
    const btn = document.getElementById("submit-comment");
    if (!name || !email || !text) { msg.textContent = "Please fill in all fields."; msg.className = "form-message error"; return; }
    btn.disabled = true;
    btn.textContent = "Posting…";
    try {
      await addDoc(collection(db, "posts", postId, "comments"), { name, email, text, createdAt: serverTimestamp(), replies: [] });
      await updateDoc(doc(db, "posts", postId), { commentCount: increment(1) });
      document.getElementById("c-name").value = "";
      document.getElementById("c-email").value = "";
      document.getElementById("c-text").value = "";
      msg.textContent = "Comment posted!";
      msg.className = "form-message success";
      loadComments();
    } catch (err) {
      msg.textContent = "Failed to post comment. Please try again.";
      msg.className = "form-message error";
    } finally {
      btn.disabled = false;
      btn.textContent = "Post Comment";
    }
  });

  loadPost();
</script>
</body>
</html>
