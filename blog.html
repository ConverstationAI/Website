<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Converstation AI</title>
  <meta name="description" content="Updates, insights, and news from Converstation AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cobalt: #0052CC; --cobalt-dark: #003d99; --cobalt-light: #EBF8FF;
      --ink: #1A202C; --ink-light: #4A5568; --muted: #718096;
      --border: #E2E8F0; --bg: #ffffff; --bg-soft: #F7FAFC; --nav-h: 72px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; color: var(--ink); background: var(--bg); overflow-x: hidden; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--nav-h); background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; }
    .nav-logo { font-size: 18px; font-weight: 700; color: var(--ink); text-decoration: none; }
    .nav-logo span { color: var(--cobalt); }
    .nav-links { display: flex; gap: 28px; align-items: center; }
    .nav-link { font-size: 15px; font-weight: 500; color: var(--ink-light); text-decoration: none; transition: color 0.2s; }
    .nav-link:hover { color: var(--cobalt); }
    .nav-cta { background: var(--cobalt); color: white; border-radius: 8px; padding: 9px 20px; font-size: 15px; font-weight: 600; text-decoration: none; transition: all 0.2s; }
    .nav-cta:hover { background: var(--cobalt-dark); }

    /* HERO */
    .blog-hero { padding: calc(var(--nav-h) + 60px) 5% 48px; background: linear-gradient(180deg, #F0F6FF 0%, #fff 100%); }
    .blog-hero-inner { max-width: 860px; margin: 0 auto; }
    .blog-eyebrow { font-size: 12px; font-weight: 700; color: var(--cobalt); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; }
    .blog-title { font-family: 'DM Serif Display', serif; font-size: clamp(32px, 5vw, 52px); color: var(--ink); margin-bottom: 14px; line-height: 1.1; }
    .blog-sub { font-size: 17px; color: var(--muted); }

    /* FILTER TABS */
    .filter-bar { max-width: 860px; margin: 0 auto 40px; padding: 0 5%; display: flex; gap: 10px; flex-wrap: wrap; padding-top: 32px; }
    .filter-btn { font-size: 14px; font-weight: 600; padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border); background: white; color: var(--muted); cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .filter-btn.active, .filter-btn:hover { background: var(--cobalt); color: white; border-color: var(--cobalt); }

    /* POST GRID */
    .posts-section { max-width: 860px; margin: 0 auto; padding: 0 5% 80px; }
    .posts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .post-card { border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; background: white; transition: all 0.25s; text-decoration: none; display: flex; flex-direction: column; }
    .post-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,82,204,0.1); border-color: #BEE3F8; }
    .post-thumb { width: 100%; height: 200px; object-fit: cover; background: var(--cobalt-light); display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .post-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .post-thumb.video-thumb { position: relative; }
    .post-thumb.video-thumb::after { content: '▶'; position: absolute; font-size: 36px; color: white; background: rgba(0,0,0,0.45); border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
    .post-body { padding: 24px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .post-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--cobalt); background: var(--cobalt-light); padding: 3px 10px; border-radius: 20px; }
    .post-headline { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); line-height: 1.3; flex: 1; }
    .post-excerpt { font-size: 14px; color: var(--muted); line-height: 1.65; }
    .post-meta { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
    .post-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--cobalt); color: white; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .post-author-info { font-size: 13px; color: var(--muted); }
    .post-author-info strong { color: var(--ink); font-weight: 600; }
    .post-comment-count { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state p { font-size: 16px; margin-top: 10px; }

    /* LOADING */
    .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 16px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--cobalt); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* FOOTER */
    footer { background: var(--ink); padding: 32px 5%; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .footer-logo { font-size: 15px; font-weight: 700; color: white; text-decoration: none; }
    .footer-logo span { color: #60A5FA; }
    .footer-copy { font-size: 13px; color: rgba(255,255,255,0.35); }

    @media (max-width: 640px) {
      .posts-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Converstation <span>AI</span></a>
  <div class="nav-links">
    <a href="/#products" class="nav-link">Products</a>
    <a href="/#about" class="nav-link">About</a>
    <a href="/blog.html" class="nav-link" style="color:var(--cobalt)">Blog</a>
    <a href="/#contact" class="nav-cta">Get in Touch</a>
  </div>
</nav>

<div class="blog-hero">
  <div class="blog-hero-inner">
    <p class="blog-eyebrow">Converstation AI</p>
    <h1 class="blog-title">Updates & Insights</h1>
    <p class="blog-sub">News, product updates, and research from the Converstation AI team.</p>
  </div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-tag="all">All</button>
  <button class="filter-btn" data-tag="CaseyMD">CaseyMD</button>
  <button class="filter-btn" data-tag="V2VLab">V2VLab</button>
  <button class="filter-btn" data-tag="Research">Research</button>
  <button class="filter-btn" data-tag="Company">Company</button>
</div>

<section class="posts-section">
  <div id="posts-grid" class="posts-grid">
    <div class="loading"><div class="spinner"></div>Loading posts…</div>
  </div>
</section>

<footer>
  <a href="/" class="footer-logo">Converstation <span>AI</span> LLC</a>
  <span class="footer-copy">© 2026 Converstation AI LLC. All rights reserved.</span>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, getDocs, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "converstation-ai.firebaseapp.com",
    projectId: "converstation-ai",
    storageBucket: "converstation-ai.appspot.com",
    messagingSenderId: "264470224727",
    appId: "1:264470224727:web:abc123"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentTag = "all";

  async function loadPosts(tag = "all") {
    const grid = document.getElementById("posts-grid");
    grid.innerHTML = '<div class="loading"><div class="spinner"></div>Loading posts…</div>';
    try {
      let q = query(collection(db, "posts"), where("published", "==", true), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      const posts = [];
      snap.forEach(doc => {
        const d = doc.data();
        if (tag === "all" || d.tag === tag) posts.push({ id: doc.id, ...d });
      });

      if (posts.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div style="font-size:48px">✍️</div><p>No posts yet. Check back soon!</p></div>';
        return;
      }

      grid.innerHTML = posts.map(p => {
        const date = p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }) : "";
        const initials = (p.authorName || "CA").split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
        let thumbHtml = `<div class="post-thumb" style="background:var(--cobalt-light)">💬</div>`;
        if (p.coverImage) thumbHtml = `<div class="post-thumb"><img src="${p.coverImage}" alt="" /></div>`;
        else if (p.coverVideo) thumbHtml = `<div class="post-thumb video-thumb"><img src="${p.coverVideoThumb || ''}" alt="" /></div>`;
        return `
          <a class="post-card" href="post.html?id=${p.id}">
            ${thumbHtml}
            <div class="post-body">
              <span class="post-tag">${p.tag || "Update"}</span>
              <div class="post-headline">${p.title}</div>
              <div class="post-excerpt">${(p.excerpt || "").slice(0, 120)}${p.excerpt?.length > 120 ? "…" : ""}</div>
              <div class="post-meta">
                <div class="post-avatar">${initials}</div>
                <div class="post-author-info"><strong>${p.authorName || "Converstation AI"}</strong><br>${date}</div>
                <span class="post-comment-count">💬 ${p.commentCount || 0}</span>
              </div>
            </div>
          </a>`;
      }).join("");
    } catch (err) {
      console.error(err);
      grid.innerHTML = '<div class="empty-state"><p>Could not load posts. Please try again.</p></div>';
    }
  }

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentTag = btn.dataset.tag;
      loadPosts(currentTag);
    });
  });

  loadPosts();
</script>
</body>
</html>
